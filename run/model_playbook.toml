# Project_Persona -- model playbook for the first-run provisioner.
# manage.py profiles the host (run/node_capabilities.json) and the matcher
# (scripts/provision_match.py) picks the highest-ranked model whose largest
# affordable quant fits the memory budget, preferring vision-capable models
# (more so when a camera is present). See
# docs/model_provisioner_design_20260607_2158.md.
#
# LICENSING: every default entry is OSI-open / AGPL-compatible (Apache-2.0).
# Gated/restrictive families (Gemma, Llama, Qwen2.5-VL 3B/72B) are intentionally
# absent; they belong only in an opt-in [extras] catalog (not auto-selected).
#
# SIZES are approximate GGUF file sizes (MiB) and MUST be re-verified against the
# Hugging Face repo at implementation time -- quants/filenames drift.

[meta]
catalog_verified = "2026-06-07"
reserve_mb       = 4096    # OS + API + embedder + Chroma headroom, off total RAM
vram_reserve_mb  = 1024    # leave VRAM for KV cache / compositor
vision_boost     = 5       # added to rank when model is vision-capable AND a camera is present
vision_soft_boost = 2      # added when model is vision-capable (always; soft preference)
cpu_max_file_mb  = 9000    # on cpu-only hosts skip quants larger than this (speed)

# ---------------------------------------------------------------------------
# Tier 4 -- workstation / high unified memory. The committed flagship.
# ---------------------------------------------------------------------------
[[model]]
id          = "qwen3.6-35b-a3b"
family      = "qwen3.6"
params_b    = 35
active_b    = 3            # MoE: only 3B activate per token (CPU-tolerant)
vision      = true
license     = "apache-2.0"
repo        = "unsloth/Qwen3.6-35B-A3B-GGUF"
mmproj      = "mmproj-Qwen3.6-35B-A3B-F16.gguf"
rank        = 70
ctx_default = 16384
min_ctx     = 8192
quants = [
  { name = "Q5_K_XL", file = "Qwen3.6-35B-A3B-UD-Q5_K_XL.gguf", size_mb = 26000 },
  { name = "Q4_K_M",  file = "Qwen3.6-35B-A3B-UD-Q4_K_M.gguf",  size_mb = 21000 },
]

